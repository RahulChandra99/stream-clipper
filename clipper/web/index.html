<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipper</title>
<style>
:root {
  --bg: #0d0e12; --panel: #16181e; --panel2: #1e2129; --line: #2a2e38;
  --text: #eef0f4; --muted: #8b92a1; --accent: #ffe600; --accent-ink: #111;
  --danger: #ff5c6c; --ok: #4ade80; --radius: 14px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
header { display: flex; align-items: center; gap: 14px; padding: 14px 28px;
  border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
header .logo { font-weight: 800; font-size: 18px; letter-spacing: -.3px; cursor: pointer; }
header .logo span { color: var(--accent); }
header .crumb { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
main { max-width: 1180px; margin: 0 auto; padding: 28px; }
h1 { font-size: 30px; letter-spacing: -.6px; margin: 18px 0 6px; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 34px 0 12px;
  text-transform: uppercase; letter-spacing: .6px; }
.sub { color: var(--muted); margin: 0 0 22px; }

.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #444a58; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger:hover { color: var(--danger); }

input[type=text], input[type=number], select, textarea {
  background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.row { display: flex; gap: 12px; align-items: flex-end; }
.row > * { flex: 1; }
textarea { resize: vertical; min-height: 90px; }
.check { display: flex; gap: 9px; align-items: center; color: var(--muted); font-size: 14px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

/* home */
.drop { background: var(--panel); border: 1.5px dashed var(--line); border-radius: var(--radius);
  padding: 22px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: #1b1c14; }
.drop .big { display: flex; gap: 10px; }
.drop .big input { font-size: 17px; padding: 14px 16px; }
.drop .big .btn { padding: 14px 26px; font-size: 16px; }
.drop .hint { color: var(--muted); font-size: 13.5px; margin: 10px 2px 0; }
.drop .hint a { color: var(--text); cursor: pointer; text-decoration: underline; }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 18px; }
.opts label.field { margin: 0; }
#rights { margin-top: 16px; }

.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.proj { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; cursor: pointer; display: flex; gap: 12px; position: relative; }
.proj:hover { border-color: #444a58; }
.proj .thumb { width: 54px; height: 96px; border-radius: 8px; background: #000; flex: none; object-fit: cover; }
.proj .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj .m { color: var(--muted); font-size: 13px; margin-top: 4px; }
.proj .x { position: absolute; top: 6px; right: 6px; opacity: 0; }
.proj:hover .x { opacity: 1; }
.empty { color: var(--muted); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }

/* progress */
.steps { display: flex; gap: 8px; margin: 26px 0 10px; }
.step { flex: 1; }
.step .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.step.done .bar { background: var(--accent); }
.step.now .bar::after { content: ""; display: block; height: 100%; width: 40%; background: var(--accent);
  border-radius: 3px; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
.step .n { font-size: 12.5px; color: var(--muted); margin-top: 7px; }
.step.now .n, .step.done .n { color: var(--text); }
.jobmsg { color: var(--muted); }
.error { background: #2a1519; border: 1px solid #5c2630; color: #ffb3bb; padding: 12px 14px; border-radius: 10px; margin: 16px 0; }

/* clip grid */
.clips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; margin-top: 22px; }
.clip { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.clip .frame { aspect-ratio: 9/16; background: #000; position: relative; }
.clip video { width: 100%; height: 100%; display: block; }
.clip .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
  text-align: center; padding: 18px; background: rgba(13,14,18,.82); }
.clip .body { padding: 12px 14px 14px; }
.clip .t { font-weight: 650; }
.clip .m { color: var(--muted); font-size: 13px; margin: 4px 0 10px; min-height: 2.9em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clip .acts { display: flex; gap: 8px; }
.clip .acts .btn { flex: 1; }
.badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.7); border-radius: 20px;
  padding: 3px 9px; font-size: 12px; }
.ring { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--line);
  border-top-color: var(--accent); animation: spin .9s linear infinite; margin: 0 auto 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* editor */
.overlay { position: fixed; inset: 0; background: rgba(5,6,8,.82); z-index: 20; display: grid; place-items: center; padding: 22px; }
.editor { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; width: min(1080px, 100%);
  height: min(820px, 100%); display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
.editor .left { background: #000; display: flex; flex-direction: column; }
.editor .left .frame { flex: 1; min-height: 0; position: relative; display: grid; place-items: center; }
.editor .left video { max-width: 100%; max-height: 100%; }
.editor .left .wait { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.72); text-align: center; }
.editor .left .foot { padding: 12px; display: flex; gap: 8px; background: var(--panel); border-top: 1px solid var(--line); }
.editor .left .foot .btn { flex: 1; }
.editor .right { display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 4px; padding: 12px 16px 0; border-bottom: 1px solid var(--line); align-items: center; }
.tab { padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--text); border-color: var(--accent); }
.tabs .sp { flex: 1; }
.pane { padding: 20px 22px; overflow: auto; flex: 1; }
.pane[hidden] { display: none; }
.nudge { display: flex; gap: 6px; align-items: center; }
.nudge input { text-align: center; }
.nudge .btn { padding: 9px 11px; }
.words { display: flex; flex-wrap: wrap; gap: 5px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; max-height: 250px; overflow: auto; }
.words input { width: auto; padding: 4px 6px; border-radius: 6px; background: var(--panel2); border-color: transparent; }
.words input.off { text-decoration: line-through; opacity: .4; }
.note { color: var(--muted); font-size: 13px; margin: 6px 0 16px; }
.pub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
.pub .btn { text-align: left; padding: 13px 14px; }
.pub .btn b { display: block; }
.pub .btn small { color: var(--muted); }
pre.desc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
  white-space: pre-wrap; word-break: break-word; font: inherit; color: var(--muted); margin: 0 0 8px; }
.qr { background: #fff; border-radius: 12px; padding: 10px; width: 200px; margin: 12px auto; }
.qr svg { width: 100%; height: auto; display: block; }
#toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #fff; color: #111;
  padding: 10px 18px; border-radius: 30px; font-weight: 600; z-index: 50; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 820px) {
  .opts { grid-template-columns: 1fr 1fr; }
  .editor { grid-template-columns: 1fr; grid-template-rows: 42% 1fr; }
}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo">clip<span>per</span></div>
  <div class="crumb" id="crumb"></div>
  <button class="btn" id="newBtn" hidden>New clips</button>
</header>
<main id="main"></main>
<div id="toast"></div>

<script>
const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k);
  return e;
}
async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {},
                                 body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const LENGTHS = { short: [15, 30, "Short, 15 to 30s"], medium: [20, 50, "Medium, 20 to 50s"], long: [40, 90, "Long, 40 to 90s"] };
const STAGES = [["probe", "Find video"], ["audio", "Audio"], ["signals", "Signals"], ["transcript", "Transcript"], ["pick", "Pick moments"], ["render", "Render"]];

let config = { styles: {}, music: [] };
let pollTimer = null, current = null, editing = null;

function go(hash) { location.hash = hash; }
window.addEventListener("hashchange", route);
$("#logo").onclick = () => go("");
$("#newBtn").onclick = () => go("");

async function route() {
  clearTimeout(pollTimer); closeEditor(); current = null;
  const pid = location.hash.slice(1);
  $("#newBtn").hidden = !pid;
  $("#crumb").textContent = "";
  if (pid) openProject(pid); else home();
}

/* ---------- home ---------- */
async function home() {
  const main = $("#main"); main.replaceChildren();
  const src = el("input", { type: "text", placeholder: "Paste a YouTube, Twitch or Kick link", autofocus: true });
  const start = el("button", { class: "btn primary" }, "Make clips");
  const file = el("input", { type: "file", accept: "video/*", hidden: true });
  const rights = el("label", { class: "check", id: "rights", hidden: true },
    el("input", { type: "checkbox" }), "This is my own video, or the creator allows clipping");
  const sel = (opts, val) => { const s = el("select"); for (const [k, label] of opts) s.append(el("option", { value: k, selected: k === val }, label)); return s; };
  const top = sel([[1, "1 clip"], [3, "3 clips"], [5, "5 clips"], [8, "8 clips"]], 3);
  const len = sel(Object.entries(LENGTHS).map(([k, v]) => [k, v[2]]), "medium");
  const style = sel(Object.entries(config.styles), "bold");
  const picker = sel(config.claude ? [["claude", "Claude picks (better)"], ["heuristic", "Offline (faster)"]] : [["heuristic", "Offline"]], config.claude ? "claude" : "heuristic");
  const field = (name, input) => el("label", { class: "field" }, el("span", {}, name), input);

  const drop = el("div", { class: "drop" },
    el("div", { class: "big" }, src, start),
    el("p", { class: "hint" }, "or drop a video file here, or ", el("a", { onclick: () => file.click() }, "choose one"), file),
    rights,
    el("div", { class: "opts" }, field("How many", top), field("Length", len), field("Captions", style), field("Picker", picker)));

  const isUrl = () => /^https?:\/\//.test(src.value.trim());
  src.oninput = () => { rights.hidden = !isUrl(); };

  async function useFile(f) {
    if (!f) return;
    start.disabled = true; start.textContent = "Uploading…";
    try {
      const res = await fetch("/api/upload?name=" + encodeURIComponent(f.name), { method: "PUT", body: f });
      src.value = (await res.json()).path; rights.hidden = true;
    } catch (e) { toast("Upload failed"); }
    start.disabled = false; start.textContent = "Make clips";
  }
  file.onchange = () => useFile(file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); useFile(e.dataTransfer.files[0]); };

  start.onclick = async () => {
    const [min_len, max_len] = LENGTHS[len.value];
    try {
      const p = await api("POST", "/api/projects", { source: src.value, rights: $("input", rights).checked,
        top: +top.value, min_len, max_len, style: style.value, picker: picker.value });
      go(p.id);
    } catch (e) { toast(e.message); }
  };
  src.onkeydown = e => { if (e.key === "Enter") start.click(); };

  const list = el("div", { class: "projects" });
  main.append(el("h1", {}, "Turn a stream into clips"),
              el("p", { class: "sub" }, "Paste a link. Get vertical clips with captions, ready to post."),
              drop, el("h2", {}, "Recent"), list);

  const projects = await api("GET", "/api/projects");
  if (!projects.length) list.replaceWith(el("div", { class: "empty" }, "Nothing yet. Your clip projects will show up here."));
  for (const p of projects) {
    const state = p.job.state === "running" ? "Working…" : p.job.state === "error" ? "Failed" : `${p.clips} clip${p.clips === 1 ? "" : "s"}`;
    list.append(el("div", { class: "proj", onclick: () => go(p.id) },
      p.thumb ? el("video", { class: "thumb", src: p.thumb + "#t=1", muted: true, preload: "metadata" }) : el("div", { class: "thumb" }),
      el("div", {}, el("div", { class: "t" }, p.title), el("div", { class: "m" }, [p.channel, state].filter(Boolean).join(" · "))),
      el("button", { class: "btn ghost small x danger", title: "Delete", onclick: async e => {
        e.stopPropagation();
        if (confirm("Delete this project and its clips?")) { await api("DELETE", "/api/projects/" + p.id); home(); }
      } }, "✕")));
  }
}

/* ---------- project ---------- */
async function openProject(pid) {
  const main = $("#main");
  main.replaceChildren(el("div", { id: "phead" }), el("div", { id: "pjob" }), el("div", { class: "clips", id: "pclips" }));
  await refresh(pid);
}

async function refresh(pid) {
  let p;
  try { p = await api("GET", "/api/projects/" + pid); } catch (e) { toast(e.message); go(""); return; }
  if (location.hash.slice(1) !== pid) return;
  current = p;
  drawProject(p);
  if (editing) syncEditor();
  const busy = p.job.state === "running" || p.clips.some(c => ["rendering", "queued"].includes(c.status));
  pollTimer = setTimeout(() => refresh(pid), busy ? 1000 : 4000);
}

function drawProject(p) {
  const title = p.meta?.title || p.source;
  $("#crumb").textContent = title;
  $("#phead").replaceChildren(el("h1", {}, title),
    el("p", { class: "sub" }, [p.meta?.channel, p.meta?.duration ? fmt(p.meta.duration) + " long" : null,
      p.meta?.chat_messages ? p.meta.chat_messages + " chat messages" : null].filter(Boolean).join(" · ")));

  const job = $("#pjob");
  if (p.job.state === "running") {
    const idx = STAGES.findIndex(s => s[0] === p.job.stage);
    job.replaceChildren(el("div", { class: "steps" }, STAGES.map(([k, name], i) =>
      el("div", { class: "step " + (i < idx ? "done" : i === idx ? "now" : "") }, el("div", { class: "bar" }), el("div", { class: "n" }, name)))),
      el("div", { class: "jobmsg" }, p.job.message || "Starting"));
  } else if (p.job.state === "error") {
    job.replaceChildren(el("div", { class: "error" }, p.job.message || "Something went wrong"));
  } else job.replaceChildren();

  const grid = $("#pclips");
  for (const c of p.clips) {
    let card = $(`[data-cid="${c.id}"]`, grid);
    if (!card) {
      card = el("div", { class: "clip", "data-cid": c.id },
        el("div", { class: "frame" }, el("video", { controls: true, playsinline: true, preload: "metadata" }), el("div", { class: "badge" }), el("div", { class: "wait" })),
        el("div", { class: "body" }, el("div", { class: "t" }), el("div", { class: "m" }),
          el("div", { class: "acts" },
            el("button", { class: "btn", onclick: () => openEditor(c.id, "clip") }, "Edit"),
            el("button", { class: "btn primary", onclick: () => openEditor(c.id, "post") }, "Post"))));
      grid.append(card);
    }
    const url = c.file ? `/media/${p.id}/${c.file}` : "";
    const v = $("video", card);
    if (url && !v.src.endsWith(url)) v.src = url;
    $(".t", card).textContent = c.title;
    $(".m", card).textContent = c.why || c.caption || "";
    $(".badge", card).textContent = fmt(c.end - c.start) + (c.dirty ? " · edited" : "");
    const wait = $(".wait", card);
    const working = ["rendering", "queued", "pending"].includes(c.status);
    wait.hidden = !(working || c.status === "error");
    wait.replaceChildren(c.status === "error" ? el("div", {}, "Render failed", el("br"), el("small", {}, c.error || ""))
      : el("div", {}, el("div", { class: "ring" }), c.status === "rendering" ? `Rendering ${Math.round((c.progress || 0) * 100)}%` : "Waiting"));
  }
  for (const card of [...grid.children]) if (!p.clips.some(c => c.id === card.dataset.cid)) card.remove();
}

/* ---------- editor ---------- */
function closeEditor() { editing = null; $(".overlay")?.remove(); }
const clipNow = () => current?.clips.find(c => c.id === editing?.cid);

let saveTimer;
function patch(fields, now) {
  const { cid } = editing, pid = current.id;
  Object.assign(clipNow(), fields, "caption" in fields && Object.keys(fields).length === 1 ? {} : { dirty: true });
  editing.pending = { ...(editing.pending || {}), ...fields };
  syncEditor();
  clearTimeout(saveTimer);
  const send = async () => {
    const body = editing?.pending; if (!body) return;
    editing.pending = null;
    try { await api("PATCH", `/api/projects/${pid}/clips/${cid}`, body); } catch (e) { toast(e.message); }
  };
  if (now) return send();
  saveTimer = setTimeout(send, 500);
}

function openEditor(cid, tab) {
  closeEditor();
  editing = { cid };
  const c = clipNow(), p = current;
  const field = (name, input) => el("label", { class: "field" }, el("span", {}, name), input);
  const sel = (opts, val, on) => { const s = el("select", { onchange: () => on(s.value) }); for (const [k, label] of opts) s.append(el("option", { value: k, selected: k === val }, label)); return s; };
  const text = (val, on, ph) => { const i = el("input", { type: "text", value: val || "", placeholder: ph }); i.oninput = () => on(i.value); return i; };

  const nudge = key => {
    const input = el("input", { type: "number", step: "0.5", value: c[key].toFixed(1) });
    const set = v => { input.value = (+v).toFixed(1); patch({ [key]: +(+v).toFixed(2) }); };
    input.onchange = () => set(input.value);
    return el("div", { class: "nudge" },
      el("button", { class: "btn", onclick: () => set(+input.value - 1) }, "−1s"), input,
      el("button", { class: "btn", onclick: () => set(+input.value + 1) }, "+1s"));
  };

  const words = el("div", { class: "words" });
  for (const w of c.words) {
    const val = c.edits?.[w.t] ?? w.word;
    const i = el("input", { type: "text", value: val, size: Math.max(2, val.length), class: val.trim() ? "" : "off", placeholder: w.word });
    i.oninput = () => {
      i.size = Math.max(2, i.value.length || w.word.length); i.className = i.value.trim() ? "" : "off";
      const edits = { ...(clipNow().edits || {}) };
      if (i.value === w.word) delete edits[w.t]; else edits[w.t] = i.value;
      patch({ edits });
    };
    words.append(i);
  }

  const musicOpts = [["", "No music"], ...config.music.map(m => [m, m.replace(/\.\w+$/, "")])];
  const vol = el("input", { type: "range", min: "0.03", max: "0.5", step: "0.01", value: c.music_vol ?? 0.15 });
  vol.onchange = () => patch({ music_vol: +vol.value });
  const bar = el("input", { type: "checkbox", checked: !!c.progress_bar });
  bar.onchange = () => patch({ progress_bar: bar.checked });

  const panes = {
    clip: el("div", { class: "pane" },
      field("Hook title (shown on the video)", text(c.title, v => patch({ title: v }))),
      el("div", { class: "row" },
        field("Show title", sel([["always", "Whole clip"], ["intro", "First 3 seconds"], ["off", "Hidden"]], c.title_mode, v => patch({ title_mode: v }))),
        field("Layout", sel([["auto", "Auto"], ["stack", "Facecam on top"], ["crop", "Follow the face"], ["blur", "Full frame, blurred edges"]], c.layout, v => patch({ layout: v })))),
      el("div", { class: "row" }, field("Start (seconds into the video)", nudge("start")), field("End", nudge("end"))),
      field("Credit line (bottom of the video)", text(c.credit ?? (p.meta?.channel ? "clip: " + p.meta.channel : ""), v => patch({ credit: v }), "leave empty to hide")),
      el("label", { class: "check" }, bar, "Progress bar along the bottom")),
    captions: el("div", { class: "pane" },
      field("Style", sel(Object.entries(config.styles), c.style, v => patch({ style: v }))),
      el("label", { class: "field" }, el("span", {}, "Words. Fix a typo, or clear a word to hide it."), words),
      el("p", { class: "note" }, "Hiding a word only removes its caption. The audio stays.")),
    audio: el("div", { class: "pane" },
      field("Background music", sel(musicOpts, c.music || "", v => patch({ music: v || null }))),
      field("Music volume", vol),
      el("p", { class: "note" }, config.music.length
        ? "Music drops in volume automatically while someone is talking."
        : "No tracks yet. Put mp3 files you have the rights to use in " + config.music_dir + " and reload. The YouTube Audio Library is a free source.")),
    voice: voicePane(c, field, sel),
    post: el("div", { class: "pane", id: "postPane" }),
  };

  const tabs = el("div", { class: "tabs" });
  const show = name => { for (const [k, pane] of Object.entries(panes)) pane.hidden = k !== name;
    for (const t of tabs.querySelectorAll(".tab")) t.classList.toggle("on", t.dataset.k === name);
    if (name === "post") drawPost(); };
  for (const [k, label] of [["clip", "Clip"], ["captions", "Captions"], ["audio", "Music"], ["voice", "Voiceover"], ["post", "Post"]])
    tabs.append(el("div", { class: "tab", "data-k": k, onclick: () => show(k) }, label));
  tabs.append(el("div", { class: "sp" }), el("button", { class: "btn ghost", onclick: closeEditor }, "Close ✕"));

  const renderBtn = el("button", { class: "btn primary", id: "renderBtn", onclick: async () => {
    await patch({}, true);
    await api("POST", `/api/projects/${current.id}/clips/${editing.cid}/render`);
    clipNow().status = "queued"; syncEditor();
  } }, "Render");

  const overlay = el("div", { class: "overlay", onmousedown: e => { if (e.target === overlay) closeEditor(); } },
    el("div", { class: "editor" },
      el("div", { class: "left" },
        el("div", { class: "frame" }, el("video", { controls: true, playsinline: true, id: "edVideo" }), el("div", { class: "wait", id: "edWait", hidden: true })),
        el("div", { class: "foot" }, renderBtn)),
      el("div", { class: "right" }, tabs, ...Object.values(panes))));
  document.body.append(overlay);
  show(tab);
  syncEditor();
}

function voicePane(c, field, sel) {
  const text = el("textarea", { rows: "5", placeholder: "Type what the voice should say. For example: Watch what happens when he finds the hidden garage." });
  text.value = c.vo_text || "";
  const info = el("p", { class: "note" }, "Leave empty for no voiceover.");
  const count = () => { const n = text.value.trim().split(/\s+/).filter(Boolean).length;
    info.textContent = n ? `${n} words, roughly ${Math.max(1, Math.round(n / 2.8))} seconds of speech. The clip is ${fmt(clipNow().end - clipNow().start)} long.` : "Leave empty for no voiceover."; };
  text.oninput = () => { patch({ vo_text: text.value }); count(); };
  count();

  const voice = sel(config.voices.map(v => [v.id, v.label]), c.vo_voice || config.voices[0]?.id, v => patch({ vo_voice: v }));
  let audio;
  const listen = el("button", { class: "btn", style: "flex:none", onclick: async () => {
    if (audio && !audio.paused) { audio.pause(); listen.textContent = "Listen"; return; }
    if (!text.value.trim()) return toast("Type something first");
    listen.disabled = true; listen.textContent = "Generating…";
    try {
      const res = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text.value, voice: voice.value }) });
      if (!res.ok) throw new Error((await res.json()).detail);
      audio = new Audio(URL.createObjectURL(await res.blob()));
      audio.onended = () => { listen.textContent = "Listen"; };
      const secs = +res.headers.get("X-Duration");
      if (secs) info.textContent = `The voiceover is ${secs.toFixed(1)} seconds. The clip is ${fmt(clipNow().end - clipNow().start)} long.`;
      await audio.play(); listen.textContent = "Stop";
    } catch (e) { toast(e.message || "Could not generate the voice"); listen.textContent = "Listen"; }
    listen.disabled = false;
  } }, "Listen");

  const at = el("input", { type: "number", min: "0", step: "0.5", value: c.vo_start ?? 0 });
  at.onchange = () => patch({ vo_start: Math.max(0, +at.value || 0) });
  const range = (key, min, max, fallback) => { const r = el("input", { type: "range", min, max, step: "0.05", value: c[key] ?? fallback });
    r.onchange = () => patch({ [key]: +r.value }); return r; };
  const caps = el("input", { type: "checkbox", checked: c.vo_captions !== false });
  caps.onchange = () => patch({ vo_captions: caps.checked });

  if (!config.voices.length) return el("div", { class: "pane" }, el("p", { class: "note" }, "No voices found. See the README, Voices."));
  return el("div", { class: "pane" },
    field("What the voice says", text), info,
    el("div", { class: "row" }, field("Voice", voice), listen),
    el("div", { class: "row" }, field("Starts at (seconds into the clip)", at), field("Voice volume", range("vo_vol", "0.4", "2", 1))),
    field("Original audio while the voice speaks (left is silent, right is full)", range("vo_duck", "0", "1", 0.2)),
    el("label", { class: "check" }, caps, "Show the voiceover's words as captions"),
    el("p", { class: "note", style: "margin-top:14px" }, config.voices.some(v => v.id.startsWith("kokoro:"))
      ? "The named voices run on this Mac with the Kokoro model. Nothing you type leaves your computer. The ones marked Mac are the older built-in voices."
      : "These are the voices built into your Mac. For natural ones, install the Kokoro model (see the README, Voices) and restart the app."));
}

function syncEditor() {
  const c = clipNow();
  if (!c) return closeEditor();
  const v = $("#edVideo"), url = c.file ? `/media/${current.id}/${c.file}` : "";
  if (url && !v.src.endsWith(url)) v.src = url;
  const working = ["rendering", "queued"].includes(c.status);
  const wait = $("#edWait");
  wait.hidden = !working;
  if (working) wait.replaceChildren(el("div", {}, el("div", { class: "ring" }), c.status === "rendering" ? `Rendering ${Math.round((c.progress || 0) * 100)}%` : "Waiting"));
  const btn = $("#renderBtn");
  btn.disabled = working || !c.dirty;
  btn.textContent = working ? "Rendering…" : c.dirty ? "Render changes" : "Up to date";
  const warn = $("#postWarn"); if (warn) warn.hidden = !c.dirty;
}

function drawPost() {
  const c = clipNow(), pid = current.id, pane = $("#postPane");
  const desc = () => (clipNow().description || "").replace(/^[^\n]*/, clipNow().caption || clipNow().title);
  const descBox = el("pre", { class: "desc" }, desc());
  const cap = el("input", { type: "text", value: c.caption || "", placeholder: "One sentence about the clip" });
  cap.oninput = () => { patch({ caption: cap.value }); descBox.textContent = desc(); };
  const copy = async (text, msg) => { await navigator.clipboard.writeText(text); toast(msg); };
  const ready = () => { if (!clipNow().file) { toast("Render the clip first"); return false; } return true; };

  const platform = (name, hint, url) => el("button", { class: "btn", onclick: async () => {
    if (!ready()) return;
    await copy(desc(), "Description copied. Drag the file from Finder.");
    await api("POST", `/api/projects/${pid}/clips/${c.id}/reveal`);
    window.open(url, "_blank");
  } }, el("b", {}, name), el("small", {}, hint));

  const shareBox = el("div");
  pane.replaceChildren(
    el("div", { class: "error", id: "postWarn", hidden: !c.dirty }, "You have changes that are not rendered yet. Render before posting."),
    el("label", { class: "field" }, el("span", {}, "Title"),
      el("div", { class: "row" }, el("input", { type: "text", value: c.title, readonly: true }),
        el("button", { class: "btn", style: "flex:none", onclick: () => copy(clipNow().title, "Title copied") }, "Copy"))),
    el("label", { class: "field" }, el("span", {}, "Caption"), cap),
    el("label", { class: "field" }, el("span", {}, "Description, with credit to the source"), descBox,
      el("button", { class: "btn small", onclick: () => copy(desc(), "Description copied") }, "Copy description")),
    el("p", { class: "note" }, "Each button copies the description, shows the file in Finder and opens the upload page. Drag the file in and paste."),
    el("div", { class: "pub" },
      platform("YouTube Shorts", "studio.youtube.com", "https://www.youtube.com/upload"),
      platform("Instagram Reels", "instagram.com, then Create", "https://www.instagram.com/"),
      platform("TikTok", "tiktok.com/tiktokstudio", "https://www.tiktok.com/tiktokstudio/upload"),
      el("button", { class: "btn", onclick: async () => {
        if (!ready()) return;
        const s = await api("POST", `/api/projects/${pid}/clips/${c.id}/share`);
        const qr = el("div", { class: "qr" }); qr.innerHTML = s.qr;
        shareBox.replaceChildren(qr, el("p", { class: "note", style: "text-align:center" },
          `Scan with your phone on the same Wi-Fi. The link works for ${s.minutes} minutes.`));
      } }, el("b", {}, "Send to phone"), el("small", {}, "QR code, same Wi-Fi"))),
    el("div", { class: "row" },
      el("button", { class: "btn", onclick: async () => { if (ready()) await api("POST", `/api/projects/${pid}/clips/${c.id}/reveal`); } }, "Show in Finder"),
      el("button", { class: "btn danger", onclick: async () => {
        if (!confirm("Delete this clip?")) return;
        await api("DELETE", `/api/projects/${pid}/clips/${c.id}`);
        current.clips = current.clips.filter(x => x.id !== c.id); closeEditor(); drawProject(current);
      } }, "Delete clip")),
    shareBox);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeEditor(); });
api("GET", "/api/config").then(c => { config = c; route(); });
</script>
</body>
</html>
